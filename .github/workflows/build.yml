name: Build Kernel Exynos 9810 IPv6

"on":
  workflow_dispatch:
  push:
    branches:
      - v45.4-ipv6
    paths:
      - ".github/workflows/build.yml"

jobs:
  build-universal:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Install build tools and Clang 16
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip

          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
          sudo apt-get install -y clang-16

          test -x /usr/bin/clang-16
          test -x /usr/bin/aarch64-linux-gnu-gcc
          test -x /usr/bin/aarch64-linux-gnu-as
          test -x /usr/bin/aarch64-linux-gnu-ld
          test -x /usr/bin/aarch64-linux-gnu-elfedit

          echo "=== CLANG ==="
          /usr/bin/clang-16 --version

          echo "=== GCC AARCH64 ==="
          /usr/bin/aarch64-linux-gnu-gcc --version

      - name: 3. Download ARM32 arm-eabi toolchain
        run: |
          set -e

          rm -rf toolchains/gcc32
          mkdir -p toolchains

          git clone --depth=1 \
            --branch android-8.1.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 \
            toolchains/gcc32

          test -x toolchains/gcc32/bin/arm-eabi-gcc
          test -x toolchains/gcc32/bin/arm-eabi-as
          test -x toolchains/gcc32/bin/arm-eabi-ld

          echo "=== GCC ARM32 ==="
          toolchains/gcc32/bin/arm-eabi-gcc --version

      - name: 4. Download original v45.4 flash ZIP
        run: |
          set -e

          wget -q --show-progress \
            https://github.com/xxmustafacooTR/android_kernel_samsung_universal9810/releases/download/v45.4/xxmustafacooTR-45.4-ENFORCE.zip \
            -O flashable.zip

          test -s flashable.zip
          unzip -t flashable.zip

          rm -rf Flashable_Dir
          unzip -q flashable.zip -d Flashable_Dir

          test -d Flashable_Dir/Kernel/starlte
          test -d Flashable_Dir/Kernel/star2lte
          test -d Flashable_Dir/Kernel/crownlte

      - name: 5. Patch config and build script
        run: |
          set -e

          mkdir -p Zip/Kernel/starlte
          mkdir -p Zip/Kernel/star2lte
          mkdir -p Zip/Kernel/crownlte

          # Bật IPv6 MASQUERADE trong cả hai defconfig nền
          for f in \
            arch/arm64/configs/exynos9810_defconfig \
            arch/arm64/configs/exynos9810_stock_defconfig
          do
            sed -i \
              's/# CONFIG_NF_NAT_MASQUERADE_IPV6 is not set/CONFIG_NF_NAT_MASQUERADE_IPV6=y/' \
              "$f"

            sed -i \
              's/# CONFIG_IP6_NF_TARGET_MASQUERADE is not set/CONFIG_IP6_NF_TARGET_MASQUERADE=y/' \
              "$f"

            grep -qx 'CONFIG_NF_NAT_MASQUERADE_IPV6=y' "$f"
            grep -qx 'CONFIG_IP6_NF_TARGET_MASQUERADE=y' "$f"
          done

          # Bắt build_kernel.sh dừng ngay khi có lỗi
          if ! grep -qx 'set -e' build_kernel.sh; then
            sed -i '2i set -e' build_kernel.sh
          fi

          # Chèn kiểm tra .config cuối sau mỗi lần tạo temp defconfig
          python3 <<'PY'
          from pathlib import Path

          path = Path("build_kernel.sh")
          text = path.read_text()

          needle = "make exynos9810_temp_defconfig\n"
          check_1 = "grep -qx 'CONFIG_NF_NAT_MASQUERADE_IPV6=y' .config"
          check_2 = "grep -qx 'CONFIG_IP6_NF_TARGET_MASQUERADE=y' .config"

          if needle not in text:
              raise SystemExit(
                  "Không tìm thấy lệnh make exynos9810_temp_defconfig"
              )

          if check_1 not in text:
              replacement = (
                  "make exynos9810_temp_defconfig\n"
                  "grep -qx 'CONFIG_NF_NAT_MASQUERADE_IPV6=y' .config\n"
                  "grep -qx 'CONFIG_IP6_NF_TARGET_MASQUERADE=y' .config\n"
              )
              text = text.replace(needle, replacement)

          path.write_text(text)
          PY

          # Đổi đường dẫn toolchain sang môi trường GitHub Actions
          sed -i \
            "s|export CC=.*|export CC=/usr/bin/clang-16|g" \
            build_kernel.sh

          sed -i \
            "s|export CROSS_COMPILE=.*|export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-|g" \
            build_kernel.sh

          sed -i \
            "s|export CROSS_COMPILE_ARM32=.*|export CROSS_COMPILE_ARM32=\$(pwd)/toolchains/gcc32/bin/arm-eabi-|g" \
            build_kernel.sh

          sed -i \
            "s|export CLANG_TRIPLE=.*|export CLANG_TRIPLE=aarch64-linux-gnu-|g" \
            build_kernel.sh

          sed -i \
            "s|ZIP_DIR=.*|ZIP_DIR=\"\$(pwd)/Zip/\"|g" \
            build_kernel.sh

          sed -i \
            "s|ZIP_ALT_DIR=.*|ZIP_ALT_DIR=\"\$(pwd)/NO_ZIP_ALT/\"|g" \
            build_kernel.sh

          rm -rf NO_ZIP_ALT
          chmod +x build_kernel.sh

          echo "=== FINAL DEFCONFIG CHECK ==="
          grep -E \
            'CONFIG_NF_NAT_MASQUERADE_IPV6|CONFIG_IP6_NF_TARGET_MASQUERADE' \
            arch/arm64/configs/exynos9810_defconfig

      - name: 6. Build S9 S9Plus and Note9
        run: |
          set -e
          ./build_kernel.sh -a

      - name: 7. Package universal flash ZIP
        run: |
          set -e

          test -s Zip/Kernel/starlte/zImage
          test -s Zip/Kernel/starlte/dtb.img

          test -s Zip/Kernel/star2lte/zImage
          test -s Zip/Kernel/star2lte/dtb.img

          test -s Zip/Kernel/crownlte/zImage
          test -s Zip/Kernel/crownlte/dtb.img

          cp -f Zip/Kernel/starlte/zImage \
            Flashable_Dir/Kernel/starlte/zImage

          cp -f Zip/Kernel/starlte/dtb.img \
            Flashable_Dir/Kernel/starlte/dtb.img

          cp -f Zip/Kernel/star2lte/zImage \
            Flashable_Dir/Kernel/star2lte/zImage

          cp -f Zip/Kernel/star2lte/dtb.img \
            Flashable_Dir/Kernel/star2lte/dtb.img

          cp -f Zip/Kernel/crownlte/zImage \
            Flashable_Dir/Kernel/crownlte/zImage

          cp -f Zip/Kernel/crownlte/dtb.img \
            Flashable_Dir/Kernel/crownlte/dtb.img

          rm -f Universal-Kernel-S9-Series-IPv6-Ready.zip

          cd Flashable_Dir
          zip -r9 ../Universal-Kernel-S9-Series-IPv6-Ready.zip .
          cd ..

          test -s Universal-Kernel-S9-Series-IPv6-Ready.zip
          unzip -t Universal-Kernel-S9-Series-IPv6-Ready.zip

      - name: 8. Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Kernel-Farm
          path: Universal-Kernel-S9-Series-IPv6-Ready.zip
          if-no-files-found: error
