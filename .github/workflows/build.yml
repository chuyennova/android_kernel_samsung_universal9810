name: Build Kernel Exynos 9810 IPv6

"on":
  workflow_dispatch:
  push:
    branches:
      - v45.4-ipv6
    paths:
      - ".github/workflows/build.yml"

jobs:
  build-universal:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Install build tools and Clang 16
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip

          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
          sudo apt-get install -y clang-16

          test -x /usr/bin/clang-16
          test -x /usr/bin/aarch64-linux-gnu-gcc
          test -x /usr/bin/aarch64-linux-gnu-as
          test -x /usr/bin/aarch64-linux-gnu-ld
          test -x /usr/bin/aarch64-linux-gnu-elfedit

          {
            echo "=== CLANG ==="
            /usr/bin/clang-16 --version

            echo
            echo "=== GCC AARCH64 ==="
            /usr/bin/aarch64-linux-gnu-gcc --version

            echo
            echo "=== GNU AS ==="
            /usr/bin/aarch64-linux-gnu-as --version

            echo
            echo "=== GNU LD ==="
            /usr/bin/aarch64-linux-gnu-ld --version
          } | tee toolchain-info.txt

      - name: 3. Download ARM32 arm-eabi toolchain
        run: |
          set -Eeuo pipefail

          rm -rf toolchains/gcc32
          mkdir -p toolchains

          git clone \
            --depth=1 \
            --branch android-8.1.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 \
            toolchains/gcc32

          test -x toolchains/gcc32/bin/arm-eabi-gcc
          test -x toolchains/gcc32/bin/arm-eabi-as
          test -x toolchains/gcc32/bin/arm-eabi-ld

          {
            echo
            echo "=== GCC ARM32 ==="
            toolchains/gcc32/bin/arm-eabi-gcc --version
          } | tee -a toolchain-info.txt

      - name: 4. Download original v45.4 flash ZIP
        run: |
          set -Eeuo pipefail

          wget -q --show-progress \
            https://github.com/xxmustafacooTR/android_kernel_samsung_universal9810/releases/download/v45.4/xxmustafacooTR-45.4-ENFORCE.zip \
            -O flashable.zip

          test -s flashable.zip
          unzip -t flashable.zip

          rm -rf Flashable_Dir
          unzip -q flashable.zip -d Flashable_Dir

          test -d Flashable_Dir/Kernel/starlte
          test -d Flashable_Dir/Kernel/star2lte
          test -d Flashable_Dir/Kernel/crownlte

      - name: 5. Pin WireGuard and patch configs
        run: |
          set -Eeuo pipefail

          exec > >(tee patch-full.log) 2>&1

          echo "=== PATCH STARTED: $(date -u) ==="

          mkdir -p Zip/Kernel/starlte
          mkdir -p Zip/Kernel/star2lte
          mkdir -p Zip/Kernel/crownlte

          echo
          echo "=== DISABLE OLD AUTO WIREGUARD FETCH ==="

          test -f scripts/Kbuild.include

          sed -i \
            '/fetch-latest-wireguard\.sh/d' \
            scripts/Kbuild.include

          if grep -q \
            'fetch-latest-wireguard\.sh' \
            scripts/Kbuild.include
          then
            echo "ERROR: WireGuard auto-fetch hook still exists"
            exit 1
          fi

          echo
          echo "=== INSTALL PINNED WIREGUARD v1.0.20220627 ==="

          rm -rf net/wireguard
          rm -rf wireguard-linux-compat

          mkdir -p net/wireguard

          if ! git clone \
            --depth=1 \
            --branch v1.0.20220627 \
            https://git.zx2c4.com/wireguard-linux-compat \
            wireguard-linux-compat
          then
            echo "Official WireGuard server clone failed."
            echo "Trying GitHub mirror..."

            rm -rf wireguard-linux-compat

            git clone \
              --depth=1 \
              --branch v1.0.20220627 \
              https://github.com/WireGuard/wireguard-linux-compat.git \
              wireguard-linux-compat
          fi

          test -s wireguard-linux-compat/src/Kconfig
          test -s wireguard-linux-compat/src/Makefile
          test -s wireguard-linux-compat/src/main.c

          cp -a \
            wireguard-linux-compat/src/. \
            net/wireguard/

          test -s net/wireguard/Kconfig
          test -s net/wireguard/Makefile
          test -s net/wireguard/main.c

          echo
          echo "=== WIREGUARD SOURCE READY ==="

          grep -n \
            'config WIREGUARD' \
            net/wireguard/Kconfig

          git -C wireguard-linux-compat \
            describe \
            --tags \
            --always

          echo
          echo "=== ENABLE REQUIRED KERNEL CONFIGS ==="

          set_config_y() {
            local file="$1"
            local option="$2"

            if grep -q \
              "^# ${option} is not set$" \
              "$file"
            then
              sed -i \
                "s/^# ${option} is not set$/${option}=y/" \
                "$file"

            elif grep -q \
              "^${option}=" \
              "$file"
            then
              sed -i \
                "s/^${option}=.*/${option}=y/" \
                "$file"

            else
              printf '\n%s=y\n' "$option" >> "$file"
            fi

            grep -qx \
              "${option}=y" \
              "$file"
          }

          for config_file in \
            arch/arm64/configs/exynos9810_defconfig \
            arch/arm64/configs/exynos9810_stock_defconfig
          do
            test -f "$config_file"

            set_config_y \
              "$config_file" \
              CONFIG_WIREGUARD

            set_config_y \
              "$config_file" \
              CONFIG_NF_NAT_MASQUERADE_IPV6

            set_config_y \
              "$config_file" \
              CONFIG_IP6_NF_TARGET_MASQUERADE

            echo
            echo "=== CHECK $config_file ==="

            grep -E \
              '^(CONFIG_WIREGUARD|CONFIG_NF_NAT_MASQUERADE_IPV6|CONFIG_IP6_NF_TARGET_MASQUERADE)=' \
              "$config_file"
          done

          echo
          echo "=== PATCH BUILD SCRIPT ==="

          test -f build_kernel.sh

          if ! grep -qx \
            'set -e' \
            build_kernel.sh
          then
            sed -i \
              '2i set -e' \
              build_kernel.sh
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build_kernel.sh")
          text = path.read_text()

          needle = "make exynos9810_temp_defconfig\n"

          checks = (
              "make exynos9810_temp_defconfig\n"
              "grep -qx 'CONFIG_WIREGUARD=y' .config\n"
              "grep -qx 'CONFIG_NF_NAT_MASQUERADE_IPV6=y' .config\n"
              "grep -qx 'CONFIG_IP6_NF_TARGET_MASQUERADE=y' .config\n"
          )

          if needle not in text:
              raise SystemExit(
                  "ERROR: make exynos9810_temp_defconfig not found"
              )

          if "grep -qx 'CONFIG_WIREGUARD=y' .config" not in text:
              text = text.replace(needle, checks)

          text = re.sub(
              r"make\s+-j\$\(\s*nproc(?:\s+--all)?\s*\)",
              "make V=1 -j1",
              text,
          )

          path.write_text(text)
          PY

          sed -i \
            "s|^export CC=.*|export CC=/usr/bin/clang-16|g" \
            build_kernel.sh

          sed -i \
            "s|^export CROSS_COMPILE=.*|export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-|g" \
            build_kernel.sh

          sed -i \
            "s|^export CROSS_COMPILE_ARM32=.*|export CROSS_COMPILE_ARM32=\$(pwd)/toolchains/gcc32/bin/arm-eabi-|g" \
            build_kernel.sh

          sed -i \
            "s|^export CLANG_TRIPLE=.*|export CLANG_TRIPLE=aarch64-linux-gnu-|g" \
            build_kernel.sh

          sed -i \
            "s|^ZIP_DIR=.*|ZIP_DIR=\"\$(pwd)/Zip/\"|g" \
            build_kernel.sh

          sed -i \
            "s|^ZIP_ALT_DIR=.*|ZIP_ALT_DIR=\"\$(pwd)/NO_ZIP_ALT/\"|g" \
            build_kernel.sh

          rm -rf NO_ZIP_ALT

          chmod +x build_kernel.sh

          cp -f \
            build_kernel.sh \
            build_kernel-patched.sh

          echo
          echo "=== TOOLCHAIN SETTINGS AFTER PATCH ==="

          grep -nE \
            '^(export CC|export CROSS_COMPILE|export CROSS_COMPILE_ARM32|export CLANG_TRIPLE|ZIP_DIR|ZIP_ALT_DIR)' \
            build_kernel.sh

          echo
          echo "=== MAKE COMMANDS AFTER DEBUG PATCH ==="

          grep -nE \
            'make (V=1 )?-j' \
            build_kernel.sh \
            || true

          echo
          echo "=== FINAL DEFCONFIG CHECK ==="

          for config_file in \
            arch/arm64/configs/exynos9810_defconfig \
            arch/arm64/configs/exynos9810_stock_defconfig
          do
            echo "--- $config_file ---"

            grep -E \
              '^(CONFIG_WIREGUARD|CONFIG_NF_NAT_MASQUERADE_IPV6|CONFIG_IP6_NF_TARGET_MASQUERADE)=' \
              "$config_file"
          done

          echo
          echo "=== PATCH FINISHED: $(date -u) ==="

      - name: 6. Build S9 S9Plus and Note9 with full log
        run: |
          set -Eeuo pipefail

          echo \
            "=== BUILD STARTED: $(date -u) ===" \
            | tee build-full.log

          ./build_kernel.sh -a \
            2>&1 \
            | tee -a build-full.log

          echo \
            "=== BUILD FINISHED: $(date -u) ===" \
            | tee -a build-full.log

      - name: 7. Collect debug files
        if: always()
        run: |
          set +e

          mkdir -p debug-files

          cp -f \
            patch-full.log \
            debug-files/ \
            2>/dev/null

          cp -f \
            build-full.log \
            debug-files/ \
            2>/dev/null

          cp -f \
            toolchain-info.txt \
            debug-files/ \
            2>/dev/null

          cp -f \
            build_kernel.sh \
            debug-files/ \
            2>/dev/null

          cp -f \
            build_kernel-patched.sh \
            debug-files/ \
            2>/dev/null

          cp -f \
            .config \
            debug-files/final-dot-config.txt \
            2>/dev/null

          cp -f \
            arch/arm64/configs/exynos9810_defconfig \
            debug-files/ \
            2>/dev/null

          cp -f \
            arch/arm64/configs/exynos9810_stock_defconfig \
            debug-files/ \
            2>/dev/null

          cp -f \
            net/wireguard/Kconfig \
            debug-files/wireguard-Kconfig.txt \
            2>/dev/null

          git diff \
            > debug-files/kernel-workflow-changes.diff \
            2>/dev/null

          {
            echo "=== DEBUG FILE LIST ==="
            find debug-files \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n'
          } | tee debug-files/debug-file-list.txt

      - name: 8. Upload full build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Full-Log
          path: debug-files/
          if-no-files-found: warn
          retention-days: 7

      - name: 9. Package universal flash ZIP
        run: |
          set -Eeuo pipefail

          test -s Zip/Kernel/starlte/zImage
          test -s Zip/Kernel/starlte/dtb.img

          test -s Zip/Kernel/star2lte/zImage
          test -s Zip/Kernel/star2lte/dtb.img

          test -s Zip/Kernel/crownlte/zImage
          test -s Zip/Kernel/crownlte/dtb.img

          cp -f \
            Zip/Kernel/starlte/zImage \
            Flashable_Dir/Kernel/starlte/zImage

          cp -f \
            Zip/Kernel/starlte/dtb.img \
            Flashable_Dir/Kernel/starlte/dtb.img

          cp -f \
            Zip/Kernel/star2lte/zImage \
            Flashable_Dir/Kernel/star2lte/zImage

          cp -f \
            Zip/Kernel/star2lte/dtb.img \
            Flashable_Dir/Kernel/star2lte/dtb.img

          cp -f \
            Zip/Kernel/crownlte/zImage \
            Flashable_Dir/Kernel/crownlte/zImage

          cp -f \
            Zip/Kernel/crownlte/dtb.img \
            Flashable_Dir/Kernel/crownlte/dtb.img

          rm -f \
            Universal-Kernel-S9-Series-IPv6-Ready.zip

          cd Flashable_Dir

          zip -r9 \
            ../Universal-Kernel-S9-Series-IPv6-Ready.zip \
            .

          cd ..

          test -s \
            Universal-Kernel-S9-Series-IPv6-Ready.zip

          unzip -t \
            Universal-Kernel-S9-Series-IPv6-Ready.zip

      - name: 10. Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Kernel-Farm
          path: Universal-Kernel-S9-Series-IPv6-Ready.zip
          if-no-files-found: error
          retention-days: 7
